<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zones inondables</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
body { margin: 0; padding: 20px 32px; box-sizing: border-box;
       color: #111; background: #fcfcfc;
       font-family: "Palladio", "URW Palladio L", "Palatino Linotype", Palatino,
                    "Book Antiqua", serif;
       font-size: 15px; line-height: 1.45;
       font-variant-numeric: oldstyle-nums }
h1 { font-size: 19px; font-weight: normal; margin: 0 0 8px }
p { margin: 0 0 16px }
select { appearance: none; -webkit-appearance: none; font: inherit; color: #9E1B1B;
         background: none; border: 0; border-bottom: 1.5px solid #9E1B1B; border-radius: 0;
         padding: 0 18px 0 4px; cursor: pointer }
select:hover { background: rgba(158, 27, 27, 0.08) }
select:focus-visible { outline: 2px solid #9E1B1B; outline-offset: 2px }
.choix { position: relative; white-space: nowrap }
.choix::after { content: "▾"; position: absolute; right: 5px; top: 0; color: #9E1B1B;
                pointer-events: none; font-size: 12px; line-height: 1.9 }
.mesure { position: absolute; visibility: hidden; white-space: pre }
.nombre { font-variant-numeric: lining-nums }
.batiments { color: #001a6e }
input { font: inherit; color: #111; background: none; border: 0; border-bottom: 1.5px solid #9E1B1B;
        border-radius: 0; padding: 0 4px; width: min(28em, 100%); box-sizing: border-box }
input::placeholder { color: #888 }
input::-webkit-calendar-picker-indicator { display: none !important }
input:focus-visible { outline: 2px solid #9E1B1B; outline-offset: 2px }
#carte { height: 80vh; background: #b8c8d2 }
@media (max-width: 820px) {
  body { padding: 16px }
  #carte { height: 66vh }
}
</style>
<body>
<h1>Bâtiments en zone inondable</h1>
<p>Pour une crue <span class="choix"><select id="crue" title="Choisir la crue"></select></span>,
<span class="batiments"><span class="nombre" id="batiments"></span> bâtiments</span>
<span id="lieu">dans la vue</span> seraient inondés, avec
<span class="nombre" id="habitants"></span> habitants et
<span class="nombre" id="valeur"></span> M€ de logements.</p>
<p><input id="adresse" type="search" list="propositions" placeholder="Chercher une adresse"
  autocomplete="off" aria-label="Chercher une adresse"><datalist id="propositions"></datalist></p>
<div id="carte"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script>
const nombres = new Intl.NumberFormat("fr-FR");
const enZone = "#001a6e";
const teinteZone = "#5877c5";
const IGN = "https://data.geopf.fr/annexes/ressources/vectorTiles";
const MESURES = ["batiments", "habitants", "valeur"];
const couchesTri = {
  tri_frequent: ["ALEA_SYNT_01_01FOR_FXX", "ALEA_SYNT_02_01FOR_FXX", "ALEA_SYNT_03_01FOR_FXX"],
  tri_moyen: ["ALEA_SYNT_01_02MOY_FXX", "ALEA_SYNT_02_02MOY_FXX", "ALEA_SYNT_03_02MOY_FXX"],
  tri_moyen_climat: ["ALEA_SYNT_01_03MCC_FXX", "ALEA_SYNT_03_03MCC_FXX"],
  tri_extreme: ["ALEA_SYNT_01_04FAI_FXX", "ALEA_SYNT_02_04FAI_FXX", "ALEA_SYNT_03_04FAI_FXX"]
  };
const periodes = { jrc_10: 10, jrc_100: 100, jrc_500: 500 };
const classesCosia = [
  ["#ce7079", "#efe9dd"], ["#987752", "#dde6c4"], ["#a6aab7", "#efe9dd"], ["#62d0ff", "#efe9dd"],
  ["#bbb096", "#dde6c4"], ["#3375a1", "#b8c8d2"], ["#e9effe", "#dde6c4"], ["#126421", "#8fb877"],
  ["#4c9129", "#8fb877"], ["#b5c335", "#c3dba6"], ["#b08290", "#dde6c4"], ["#8cd76a", "#c3dba6"],
  ["#decf55", "#dde6c4"], ["#d0a349", "#dde6c4"], ["#b9e2d4", "#efe9dd"], ["#df8b52", "#c3dba6"],
  ["#222222", "#efe9dd"]
  ].map(paire => paire.map(rvb));
const correspondances = new Map();
const champ = document.getElementById("adresse");
const propositions = document.getElementById("propositions");
const liste = document.getElementById("crue");
let resultats = [];
let attente;
let demande = 0;
let synthese;
let grille;

function rvb(teinte) {
  return [1, 3, 5].map(rang => parseInt(teinte.slice(rang, rang + 2), 16));
}

function ecart(premiere, seconde) {
  return (premiere[0] - seconde[0]) ** 2 + (premiere[1] - seconde[1]) ** 2 + (premiere[2] - seconde[2]) ** 2;
}

function adoucir(couleur) {
  const cle = couleur.join(",");
  if (!correspondances.has(cle)) {
    const proche = classesCosia.reduce((meilleure, classe) => ecart(classe[0], couleur) < ecart(meilleure[0], couleur) ? classe : meilleure);
    correspondances.set(cle, proche[1]);
  }
  return correspondances.get(cle);
}

function wmts(couche, format, jeu, style) {
  return "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=" + style + "&TILEMATRIXSET=" + jeu + "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&LAYER=" + couche + "&FORMAT=" + format;
}

function wms(couches) {
  return "https://www.georisques.gouv.fr/services?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&STYLES=&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=true&LAYERS=" + couches.join(",");
}

function adresseDonnees(chemin) {
  return "pmtiles://" + new URL("donnees/" + chemin, location.href).href;
}

async function imageCosia(z, x, y, signal) {
  const adresse = wmts("IGNF_COSIA_2021-2023", "image/png", "PM_6_18", "normal")
    .replace("{z}", z)
    .replace("{x}", x)
    .replace("{y}", y);
  const reponse = await fetch(adresse, { signal });
  return reponse.ok ? createImageBitmap(await reponse.blob()) : null;
}

async function dessinerCosia(contexte, z, x, y, signal) {
  if (z >= 6) {
    const image = await imageCosia(z, x, y, signal);
    if (image) contexte.drawImage(image, 0, 0);
    return;
  }
  for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
    const image = await imageCosia(z + 1, 2 * x + dx, 2 * y + dy, signal);
    if (image) contexte.drawImage(image, dx * 128, dy * 128, 128, 128);
  }
}

function recolorer(contexte) {
  const pixels = contexte.getImageData(0, 0, 256, 256);
  const valeurs = pixels.data;
  for (let rang = 0; rang < valeurs.length; rang += 4) {
    const couleur = adoucir([valeurs[rang], valeurs[rang + 1], valeurs[rang + 2]]);
    valeurs[rang] = couleur[0];
    valeurs[rang + 1] = couleur[1];
    valeurs[rang + 2] = couleur[2];
    valeurs[rang + 3] = valeurs[rang + 3] < 128 ? 0 : 255;
  }
  contexte.putImageData(pixels, 0, 0);
}

async function tuileCosia(parametres, controleur) {
  const [z, x, y] = parametres.url.replace("cosia://", "").split("/").map(Number);
  const toile = new OffscreenCanvas(256, 256);
  const contexte = toile.getContext("2d", { willReadFrequently: true });
  contexte.imageSmoothingEnabled = false;
  await dessinerCosia(contexte, z, x, y, controleur.signal);
  recolorer(contexte);
  const fichier = await toile.convertToBlob({ type: "image/png" });
  return { data: await fichier.arrayBuffer() };
}

function style() {
  return {
    version: 8,
    glyphs: IGN + "/fonts/{fontstack}/{range}.pbf",
    sources: {
      cosia: { type: "raster", tiles: ["cosia://{z}/{x}/{y}"], tileSize: 256, minzoom: 5, maxzoom: 18 },
      estompage: { type: "raster", tiles: [wmts("ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW", "image/png", "PM_0_15", "estompage_grayscale")], tileSize: 256, maxzoom: 15 },
      tri: { type: "raster", tiles: [wms(couchesTri.tri_extreme)], tileSize: 256, minzoom: 11, maxzoom: 19 },
      eaip: { type: "raster", tiles: [wms(["MASQ_EAIP"])], tileSize: 256, minzoom: 11, maxzoom: 12 },
      jrc: { type: "vector", url: adresseDonnees("jrc.pmtiles") },
      batiments: { type: "vector", url: adresseDonnees("batiments.pmtiles") },
      communes: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      adresse: { type: "geojson", data: { type: "FeatureCollection", features: [] } }
      },
    layers: [
      { id: "fond", type: "background", paint: { "background-color": "#b8c8d2" } },
      { id: "cosia", type: "raster", source: "cosia" },
      { id: "estompage", type: "raster", source: "estompage", paint: { "raster-opacity": 0.35 } },
      { id: "tri", type: "raster", source: "tri", layout: { visibility: "none" }, paint: { "raster-hue-rotate": 75, "raster-opacity": 0.55 } },
      { id: "eaip", type: "raster", source: "eaip", layout: { visibility: "none" }, paint: { "raster-opacity": 0.6 } },
      { id: "jrc", type: "fill", source: "jrc", "source-layer": "jrc", minzoom: 9, layout: { visibility: "none" }, paint: { "fill-color": teinteZone, "fill-opacity": 0.3 } },
      { id: "batiments", type: "fill", source: "batiments", "source-layer": "batiments", minzoom: 13, paint: { "fill-color": enZone } },
      { id: "adresse", type: "fill", source: "adresse", paint: { "fill-color": "#9E1B1B" } },
      {
        id: "communes", type: "circle", source: "communes", maxzoom: 13,
        paint: {
          "circle-color": enZone,
          "circle-opacity": ["interpolate", ["linear"], ["zoom"], 11, 0.75, 13, 0.15],
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            5, ["*", 0.08, ["sqrt", ["get", "b"]]],
            9, ["*", 0.3, ["sqrt", ["get", "b"]]],
            12, ["*", 0.6, ["sqrt", ["get", "b"]]]]
          }
        }
      ]
    };
}

maplibregl.addProtocol("cosia", tuileCosia);
maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);

const carte = new maplibregl.Map({
  container: "carte",
  style: style(),
  bounds: [[-5.2, 41.3], [9.6, 51.1]],
  minZoom: 5,
  maxBounds: [[-12, 38], [16, 54]],
  attributionControl: false
  });

carte.addControl(new maplibregl.NavigationControl({ showCompass: false }));
carte.addControl(new maplibregl.AttributionControl({
  compact: true,
  customAttribution: "IGN (CoSIA, BD TOPO, Plan IGN), Géorisques (TRI, EAIP), JRC, Insee (Filosofi 2021), DGFiP (DVF)"
  }));

function gardee(couche) {
  return couche.type === "symbol"
    && (couche.id.startsWith("toponyme localite importance") || couche["source-layer"] === "toponyme_hydro_lin");
}

async function ajouterToponymes() {
  const toponymes = await fetch(IGN + "/styles/PLAN.IGN/toponymes.json").then(reponse => reponse.json());
  Object.entries(toponymes.sources).forEach(([nom, source]) => carte.addSource(nom, source));
  toponymes.layers
    .filter(gardee)
    .forEach(couche => carte.addLayer(Object.assign({}, couche, { id: "toponymes " + couche.id })));
}

async function geocoder(texte, limite) {
  const reponse = await fetch("https://data.geopf.fr/geocodage/search?limit=" + limite + "&q=" + encodeURIComponent(texte));
  return (await reponse.json()).features;
}

async function batiments(resultat) {
  if (resultat.properties.type !== "housenumber") return [];
  const reponse = await fetch("https://rnb-api.beta.gouv.fr/api/alpha/buildings/?cle_interop_ban=" + resultat.properties.id);
  return (await reponse.json()).results
    .filter(batiment => batiment.shape)
    .map(batiment => ({ type: "Feature", properties: {}, geometry: batiment.shape }));
}

async function surligner(resultat) {
  const trouves = await batiments(resultat).catch(() => []);
  carte.getSource("adresse").setData({ type: "FeatureCollection", features: trouves });
}

function centrer(resultat) {
  const zoom = resultat.properties.type === "municipality" ? 13 : 17;
  carte.flyTo({ center: resultat.geometry.coordinates, zoom });
  surligner(resultat);
}

function option(texte, valeur) {
  const noeud = document.createElement("option");
  noeud.textContent = texte;
  noeud.value = valeur;
  return noeud;
}

async function proposer() {
  resultats = await geocoder(champ.value, 5).catch(() => []);
  propositions.replaceChildren(...resultats.map(resultat => option(resultat.properties.label, resultat.properties.label)));
}

function saisir() {
  clearTimeout(attente);
  const choisi = resultats.find(resultat => resultat.properties.label === champ.value);
  if (choisi) centrer(choisi);
  else if (champ.value.trim().length >= 3) attente = setTimeout(proposer, 250);
}

async function valider(evenement) {
  if (evenement.key !== "Enter" || champ.value.trim().length < 3) return;
  const [premier] = await geocoder(champ.value, 1).catch(() => []);
  if (premier) centrer(premier);
}

function remplirListe() {
  ["tri", "jrc", "eaip"].forEach(source => {
    const groupe = document.createElement("optgroup");
    groupe.label = source.toUpperCase();
    synthese.scenarios
      .filter(scenario => scenario.source === source)
      .forEach(scenario => groupe.appendChild(option(scenario.libelle, scenario.cle)));
    liste.appendChild(groupe);
  });
  liste.value = "jrc_100";
}

function ajusterLargeur() {
  const mesure = document.createElement("span");
  mesure.className = "mesure";
  mesure.textContent = liste.options[liste.selectedIndex].text;
  liste.parentNode.appendChild(mesure);
  liste.style.width = (mesure.getBoundingClientRect().width + 26) + "px";
  mesure.remove();
}

function valeurCommune(commune, cle, mesure) {
  return commune[4 + synthese.colonnes.indexOf(cle + ":" + mesure)];
}

function afficher(lieu, sommes) {
  document.getElementById("lieu").textContent = lieu;
  MESURES.forEach((mesure, rang) => {
    document.getElementById(mesure).textContent = nombres.format(Math.round(sommes[rang]));
  });
}

function sommeDesCarreaux(cle, limites) {
  return grille[cle]
    .filter(carreau => limites.contains([carreau[0], carreau[1]]))
    .reduce((sommes, carreau) => sommes.map((somme, rang) => somme + carreau[2 + rang]), [0, 0, 0]);
}

function communeLaPlusProche(centre) {
  const distance = commune => (commune[2] - centre.lng) ** 2 + (commune[3] - centre.lat) ** 2;
  return synthese.communes.reduce((meilleure, commune) => distance(commune) < distance(meilleure) ? commune : meilleure);
}

async function communeAuCentre(centre) {
  const reponse = await fetch("https://geo.api.gouv.fr/communes?fields=code&lat=" + centre.lat + "&lon=" + centre.lng).catch(() => null);
  const trouvees = reponse && reponse.ok ? await reponse.json() : [];
  const commune = trouvees.length > 0 ? synthese.communes.find(ligne => ligne[0] === trouvees[0].code) : undefined;
  return commune || communeLaPlusProche(centre);
}

function vueEtroite(limites) {
  const largeur = limites.getNorthWest().distanceTo(limites.getNorthEast());
  const hauteur = limites.getNorthWest().distanceTo(limites.getSouthWest());
  return Math.min(largeur, hauteur) < 3000;
}

async function compter() {
  const cle = liste.value;
  const limites = carte.getBounds();
  demande = demande + 1;
  const numero = demande;
  if (!vueEtroite(limites)) {
    afficher("dans la vue", sommeDesCarreaux(cle, limites));
    return;
  }
  const commune = await communeAuCentre(carte.getCenter());
  if (numero === demande) afficher("à " + commune[1], MESURES.map(mesure => valeurCommune(commune, cle, mesure)));
}

function cercles(cle) {
  return {
    type: "FeatureCollection",
    features: synthese.communes
      .filter(commune => valeurCommune(commune, cle, "batiments") > 0)
      .map(commune => ({
        type: "Feature",
        properties: { b: valeurCommune(commune, cle, "batiments") },
        geometry: { type: "Point", coordinates: [commune[2], commune[3]] }
        }))
    };
}

function actualiser() {
  const cle = liste.value;
  const source = synthese.scenarios.find(scenario => scenario.cle === cle).source;
  ajusterLargeur();
  ["tri", "eaip", "jrc"].forEach(couche => carte.setLayoutProperty(couche, "visibility", couche === source ? "visible" : "none"));
  if (source === "tri") carte.getSource("tri").setTiles([wms(couchesTri[cle])]);
  if (source === "jrc") carte.setFilter("jrc", ["==", ["get", "p"], periodes[cle]]);
  carte.setFilter("batiments", ["has", cle]);
  carte.getSource("communes").setData(cercles(cle));
  compter();
}

async function demarrer() {
  ajouterToponymes().catch(() => null);
  synthese = await fetch("donnees/communes.json").then(reponse => reponse.json());
  grille = await fetch("donnees/carreaux.json").then(reponse => reponse.json());
  remplirListe();
  actualiser();
  liste.addEventListener("change", actualiser);
  carte.on("moveend", compter);
}

champ.addEventListener("input", saisir);
champ.addEventListener("keydown", valider);
carte.on("load", demarrer);
</script>
</body>
</html>
